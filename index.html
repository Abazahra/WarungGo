        class ErrorBoundary extends React.Component {
          constructor(props) {
            super(props);
            this.state = { hasError: false, error: null };
          }
          static getDerivedStateFromError(error) {
            return { hasError: true, error };
          }
          componentDidCatch(error, errorInfo) {
            console.error("WarungGo App Error:", error, errorInfo);
          }
          render() {
            if (this.state.hasError) {
              return (
                <div className="p-8 text-center max-w-xl mx-auto mt-20 bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl">

                    Muat Ulang Halaman
                  </button>
                </div>
              );
            }
            return this.props.children;
          }
        }

                      <div className="flex bg-slate-950 p-1.5 rounded-2xl border border-slate-800 w-full sm:w-auto">
                        <button onClick={() => setActiveTab('explore')} className={`px-4 py-2 rounded-xl text-xs font-black ${activeTab === 'explore' ? 'bg-amber-400 text-slate-950' : 'text-slate-300'}`}>🍔 Marketplace</button>
                        <button onClick={() => setActiveTab('cart')} className={`px-4 py-2 rounded-xl text-xs font-black ${activeTab === 'cart' ? 'bg-amber-400 text-slate-950' : 'text-slate-300'}`}>🛒 Keranjang ({cart.reduce((a, c) => a + c.qty, 0)})</button>
                        <button onClick={() => setActiveTab('orders')} className={`px-4 py-2 rounded-xl text-xs font-black ${activeTab === 'orders' ? 'bg-amber-400 text-slate-950' : 'text-slate-300'}`}>📦 Pesanan Saya</button>
                      </div>
                    </div>

                    {activeTab === 'explore' && (
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        {stores.map(store => (
                          <div key={store.id} className="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4 shadow-xl">
                            <div className="flex items-center gap-4">
                              <img src={store.image} alt={store.name} className="w-16 h-16 rounded-2xl object-cover" />
                              <div>
                                <h4 className="font-black text-white text-base">{store.name}</h4>
                                <p className="text-xs text-slate-400">📍 {store.address} • ⭐ {store.rating}</p>
                              </div>
                            </div>
                            <div className="space-y-3 pt-3 border-t border-slate-800">
                              {store.products.map(prod => (
                                <div key={prod.id} className="flex justify-between items-center bg-slate-950 p-3 rounded-2xl border border-slate-800">
                                  <div>
                                    <h5 className="font-bold text-white text-xs">{prod.name}</h5>
                                    <span className="text-xs font-black text-amber-400">Rp {prod.price.toLocaleString('id-ID')}</span>
                                  </div>
                                  <button onClick={() => {
                                    setCart([...cart, { productId: prod.id, storeId: store.id, storeName: store.name, name: prod.name, price: prod.price, qty: 1 }]);
                                    showNotification(`🛒 ${prod.name} ditambahkan`);
                                  }} className="bg-amber-400 text-slate-950 px-3 py-1.5 rounded-xl text-xs font-black">+ Tambah</button>
                                </div>
                              ))}
                            </div>
                          </div>
                        ))}
                      </div>
                    )}

                    {activeTab === 'cart' && (
                      <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 max-w-2xl mx-auto space-y-6">
                        <h3 className="text-lg font-black text-white">Keranjang Belanja</h3>
                        {cart.length === 0 ? <p className="text-xs text-slate-400">Keranjang kosong.</p> : (
                          <div className="space-y-4 text-xs">
                            {cart.map((item, idx) => (
                              <div key={idx} className="flex justify-between bg-slate-950 p-3 rounded-xl border border-slate-800">
                                <span>{item.name} (x{item.qty})</span>
                                <span className="font-bold text-amber-400">Rp {(item.price * item.qty).toLocaleString('id-ID')}</span>
                              </div>
                            ))}
                            <div className="space-y-2 pt-2">
                              <label className="font-bold text-slate-300">Pilih Rekening / E-Wallet Pembayaran (No: 081321312304)</label>
                              <select value={checkoutData.selectedBank} onChange={(e) => setCheckoutData({...checkoutData, selectedBank: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white">
                                {adminBanks.map(b => <option key={b.id} value={b.name}>{b.name} (081321312304 - A/N {b.holder})</option>)}
                              </select>
                            </div>
                            <button onClick={() => {
                              const subtotal = cart.reduce((a, c) => a + (c.price * c.qty), 0);
                              const total = subtotal + 8000;
                              const newOrder = {
                                id: `WG-${Math.floor(1000 + Math.random() * 9000)}`,
                                storeId: cart[0].storeId, storeName: cart[0].storeName,
                                customerName: consumerProfile.name, items: [...cart], total, subtotal, ongkir: 8000,
                                courierId: 1, courierName: 'Asep Kurir',
                                paymentMethod: `${checkoutData.selectedBank} (081321312304)`,
                                paymentStatus: 'Menunggu Verifikasi Admin', status: 'Menunggu Verifikasi Pembayaran Admin',
                                timestamp: '2026-11-01 ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                              };
                              setOrders([newOrder, ...orders]);
                              setLedgerEntries([{ id: Date.now(), date: newOrder.timestamp, desc: `Pesanan ${newOrder.id}`, paymentAccount: `${checkoutData.selectedBank} (081321312304)`, warungCut: subtotal*0.9, platformCut: subtotal*0.1, courierFee: 8000, total }, ...ledgerEntries]);
                              setAdminTotalProfit(p => p + (subtotal * 0.1));
                              setCart([]);
                              setActiveTab('orders');
                              showNotification('🎉 Pesanan dibuat! Silakan tunggu verifikasi admin.');
                            }} className="w-full bg-amber-400 text-slate-950 font-black py-3 rounded-xl">Buat Pesanan Sekarang</button>
                          </div>
                        )}
                      </div>
                    )}

                    {activeTab === 'orders' && (
                      <div className="space-y-4 max-w-2xl mx-auto text-xs">
                        <h3 className="text-lg font-black text-white">Pesanan Saya & Tracking</h3>
                        {orders.map(ord => {
                          const isVerified = !ord.status.includes('Menunggu');
                          return (
                            <div key={ord.id} className="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-3">
                              <div className="flex justify-between"><strong className="text-amber-400">{ord.id}</strong><span className="text-emerald-400">{ord.status}</span></div>
                              <p className="text-slate-300">Warung: {ord.storeName} | Total: Rp {ord.total.toLocaleString('id-ID')}</p>
                              <div className="flex gap-2 pt-2">
                                <button disabled={isVerified} onClick={() => {
                                  if (isVerified) return;
                                  setOrders(orders.map(o => o.id === ord.id ? { ...o, status: 'Dibatalkan Konsumen' } : o));
                                  showNotification(`❌ Pesanan ${ord.id} dibatalkan.`);
                                }} className={`px-4 py-2 rounded-xl font-bold ${isVerified ? 'bg-slate-800 text-slate-500 cursor-not-allowed' : 'bg-rose-500/20 text-rose-400 hover:bg-rose-500 hover:text-white'}`}>
                                  {isVerified ? '🔒 Tidak Dapat Batal (Sudah Diverifikasi)' : '❌ Batalkan Pesanan'}
                                </button>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                )}

                {/* Admin Dashboard with Ledger & Bank Management */}
                {activeRole === 'admin' && (
                  <div className="space-y-6">
                    {!adminVerified ? (
                      <div className="bg-slate-900 border border-slate-800 p-8 rounded-3xl max-w-md mx-auto space-y-4 shadow-2xl text-center">
                        <h3 className="text-xl font-black text-white">🔑 Login Admin (PIN: 123456)</h3>
                        <input type="password" placeholder="••••••" maxLength="6" value={adminPinInput} onChange={(e) => setAdminPinInput(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3 text-center text-xl text-white" />
                        <button onClick={() => { if (adminPinInput === '123456') { setAdminVerified(true); showNotification('🔓 Admin Masuk!'); } else { showNotification('❌ PIN Salah'); } }} className="w-full bg-amber-400 text-slate-950 py-3 rounded-2xl font-black">Masuk Admin</button>
                      </div>
                    ) : (
                      <div className="space-y-6">
                        <div className="flex bg-slate-900 p-2 rounded-2xl border border-slate-800 gap-2 overflow-x-auto text-xs font-bold">
                          <button onClick={() => setAdminSubTab('ledger')} className={`px-4 py-2.5 rounded-xl ${adminSubTab === 'ledger' ? 'bg-amber-400 text-slate-950' : 'text-slate-300'}`}>📊 Buku Besar & Rekening</button>
                          <button onClick={() => setAdminSubTab('banks')} className={`px-4 py-2.5 rounded-xl ${adminSubTab === 'banks' ? 'bg-amber-400 text-slate-950' : 'text-slate-300'}`}>🏦 Kelola Rekening Admin</button>
                        </div>

                        {/* Total Profit Card */}
                        <div className="bg-gradient-to-r from-amber-950 to-slate-900 p-6 rounded-3xl border border-amber-500/30 flex justify-between items-center">
                          <div>
                            <span className="text-xs text-amber-400 font-bold uppercase">Total Keuntungan Platform (Komisi 10%)</span>
                            <h2 className="text-3xl font-black text-white mt-1">Rp {adminTotalProfit.toLocaleString('id-ID')}</h2>
                          </div>
                        </div>

                        {adminSubTab === 'ledger' && (
                          <div className="bg-slate-900 p-6 rounded-3xl border border-slate-800 space-y-4 text-xs">
                            <div className="flex justify-between items-center"><h3 className="text-base font-black text-white">Buku Besar Keuangan & Rekening Konsumen</h3><button onClick={handlePrintLedger} className="bg-amber-400 text-slate-950 px-3 py-2 rounded-xl font-black">🖨️ Print Buku Besar</button></div>
                            <div className="overflow-x-auto">
                              <table className="w-full text-left">
                                <thead className="bg-slate-950 text-amber-400 border-b border-slate-800">
                                  <tr><th className="p-3">Waktu</th><th className="p-3">Deskripsi</th><th className="p-3">Rekening Pembayaran</th><th className="p-3">Warung (90%)</th><th className="p-3">Platform (10%)</th><th className="p-3">Kurir</th><th className="p-3">Total</th></tr>
                                </thead>
                                <tbody className="divide-y divide-slate-800">
                                  {ledgerEntries.map(l => (
                                    <tr key={l.id}>
                                      <td className="p-3 text-amber-400">{l.date}</td>
                                      <td className="p-3 font-bold text-white">{l.desc}</td>
                                      <td className="p-3 text-cyan-400 font-bold">{l.paymentAccount}</td>
                                      <td className="p-3">Rp {l.warungCut.toLocaleString('id-ID')}</td>
                                      <td className="p-3">Rp {l.platformCut.toLocaleString('id-ID')}</td>
                                      <td className="p-3">Rp {l.courierFee.toLocaleString('id-ID')}</td>
                                      <td className="p-3 font-black text-emerald-400">Rp {l.total.toLocaleString('id-ID')}</td>
                                    </tr>
                                  ))}
                                </tbody>
                              </table>
                            </div>
                          </div>
                        )}

                        {adminSubTab === 'banks' && (
                          <div className="bg-slate-900 p-6 rounded-3xl border border-slate-800 space-y-6 text-xs">
                            <h3 className="text-base font-black text-white">Kelola Rekening & E-Wallet Pembayaran Konsumen</h3>
                            <form onSubmit={(e) => {
                              e.preventDefault();
                              if (!newBankForm.name || !newBankForm.accNo) return;
                              setAdminBanks([...adminBanks, { id: Date.now(), ...newBankForm }]);
                              setNewBankForm({ name: '', accNo: '081321312304', holder: 'PT WarungGo Pameungpeuk' });
                              showNotification('✅ Rekening baru berhasil ditambahkan!');
                            }} className="grid grid-cols-1 sm:grid-cols-3 gap-3 bg-slate-950 p-4 rounded-2xl border border-slate-800">
                              <input type="text" placeholder="Nama Bank / E-Wallet (Contoh: SeaBank)" value={newBankForm.name} onChange={(e) => setNewBankForm({...newBankForm, name: e.target.value})} className="bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white" required />
                              <input type="text" placeholder="No Rekening / No HP" value={newBankForm.accNo} onChange={(e) => setNewBankForm({...newBankForm, accNo: e.target.value})} className="bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white" required />
                              <button type="submit" className="bg-amber-400 text-slate-950 font-black rounded-xl p-2.5">Tambah Rekening</button>
                            </form>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                              {adminBanks.map(b => (
                                <div key={b.id} className="bg-slate-950 p-4 rounded-2xl border border-slate-800 flex justify-between items-center">
                                  <div><strong className="text-amber-400">{b.name}</strong><p className="text-white font-bold">No: {b.accNo}</p><span className="text-slate-400">A/N: {b.holder}</span></div>
                                  <button onClick={() => { setAdminBanks(adminBanks.filter(x => x.id !== b.id)); showNotification(`🗑️ ${b.name} dihapus.`); }} className="bg-rose-500/20 text-rose-400 px-3 py-1.5 rounded-xl font-bold">Hapus</button>
                                </div>
                              ))}
                            </div>
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                )}
              </main>
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(
          <ErrorBoundary>
            <WarungGoApp />
          </ErrorBoundary>
        );
    </script>
</body>
</html>
